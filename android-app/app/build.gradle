plugins { id 'com.android.application' }

// Địa chỉ hệ thống mà app mở
def HOST = 'hn.oppovn.com'
def START = 'https://hn.oppovn.com/trungtamdieuhanhOPPOHN/?source=app'

android {
    namespace 'com.oppohn.dieuhanh'
    compileSdk 34
    defaultConfig {
        applicationId 'com.oppohn.dieuhanh'
        minSdk 21
        targetSdk 34
        versionCode (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()
        versionName (System.getenv('APP_VERSION_NAME') ?: '1.0')
        resValue 'string', 'appName', 'OPPO HN'
        resValue 'string', 'launcherName', 'OPPO HN'
        resValue 'string', 'launchUrl', START
        resValue 'string', 'hostName', HOST
        resValue 'string', 'providerAuthority', 'com.oppohn.dieuhanh.fileprovider'
        resValue 'string', 'assetStatements',
            '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://' + HOST + '"}}]'
        manifestPlaceholders = [hostName: HOST]
    }
    buildTypes {
        // Bản release chưa ký: khoá ký giữ riêng, ký sau khi build (không đưa khoá lên GitHub)
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
