name: Build APK OPPO HN
on:
  push:
    branches: [android-app]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: android-app
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../release/OPPO-HN-unsigned.apk
      - uses: actions/upload-artifact@v4
        with: { name: OPPO-HN-apk, path: release/OPPO-HN-unsigned.apk }
      - name: Lưu APK vào nhánh
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f release/OPPO-HN-unsigned.apk
          git commit -m "APK build ${{ github.run_number }} [skip ci]" || exit 0
          git push
